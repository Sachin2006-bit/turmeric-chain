<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Golden yellow and dark brown color scheme -->
    <style>
      .gold { fill: #D4A017; }
      .brown { fill: #8B4513; }
      .bg-gold { fill: #F0D97C; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#8B4513" stroke-width="4"/>
  
  <!-- Fields/Background -->
  <rect x="10" y="70" width="100" height="40" class="gold" opacity="0.3"/>
  <line x1="10" y1="80" x2="110" y2="80" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="10" y1="90" x2="110" y2="90" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="10" y1="100" x2="110" y2="100" stroke="#8B4513" stroke-width="1.5"/>
  
  <!-- Sunrise -->
  <circle cx="85" cy="25" r="12" class="gold"/>
  <line x1="85" y1="13" x2="85" y2="5" stroke="#8B4513" stroke-width="2"/>
  <line x1="92" y1="18" x2="98" y2="14" stroke="#8B4513" stroke-width="2"/>
  <line x1="97" y1="25" x2="105" y2="25" stroke="#8B4513" stroke-width="2"/>
  <line x1="92" y1="32" x2="98" y2="36" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Farmer's Hat -->
  <path d="M 40,35 L 75,35 L 75,40 L 40,40 Z" class="gold"/>
  <path d="M 40,35 Q 57.5,30 75,35 M 40,40 Q 57.5,35 75,40" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  
  <!-- Farmer's Head -->
  <circle cx="57.5" cy="50" r="10" class="gold" opacity="0.7"/>
  
  <!-- Farmer's Body -->
  <path d="M 52,55 L 63,55 L 63,75 L 52,75 Z" class="gold"/>
  <path d="M 50,58 Q 65,58 65,58" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  <path d="M 60,60 Q 65,65 65,70" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  <path d="M 55,60 Q 50,65 50,70" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  
  <!-- Farmer's Arms -->
  <ellipse cx="48" cy="65" rx="6" ry="3" class="gold" opacity="0.7"/>
  <ellipse cx="67" cy="65" rx="6" ry="3" class="gold" opacity="0.7"/>
  
  <!-- Turmeric Plant Root (in farmer's hands) -->
  <ellipse cx="57.5" cy="73" rx="8" ry="5" class="gold"/>
  <path d="M 50,73 Q 57.5,68 65,73" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  <path d="M 52,71 Q 57.5,66 63,71" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  <path d="M 52,75 Q 57.5,70 63,75" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  
  <!-- Plant Stem -->
  <line x1="57.5" y1="73" x2="57.5" y2="55" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Plant Leaves -->
  <path d="M 57.5,55 Q 50,50 45,55" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="50" cy="55" rx="8" ry="4" class="gold" opacity="0.7"/>
  
  <path d="M 57.5,55 Q 55,50 52,55" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="54" cy="55" rx="6" ry="3" class="gold" opacity="0.7"/>
  
  <path d="M 57.5,55 Q 65,50 70,55" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="67" cy="55" rx="8" ry="4" class="gold" opacity="0.7"/>
</svg>
